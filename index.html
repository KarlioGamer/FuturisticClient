<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuturisticClient 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0f17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            letter-spacing: 2px;
        }

        .btn-download {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0d0f17;
            background: #00e5ff;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn-download:hover {
            background: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        .footer-date {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FuturisticClient 3</h1>
        <a href="https://github.com/KarlioGamer/FuturisticClient/releases/tag/3.0_r1" class="btn-download" target="_blank" rel="noopener noreferrer">
            Baixar Agora
        </a>
    </div>

    <div class="footer-date">
        Atualizado em 26/10/2026
    </div>

</body>
</html>
